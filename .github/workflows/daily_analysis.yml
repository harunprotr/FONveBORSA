name: FONveBORSA Otomatik Analiz

on:
  schedule:
    - cron: "30 7 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: Otomatik analizi çalıştır
        run: python analysis/run_analysis.py
